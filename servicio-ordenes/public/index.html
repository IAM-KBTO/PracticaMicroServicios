<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librería API - Microservicios</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-200 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-gray-800 rounded-xl shadow-2xl overflow-hidden border border-gray-700">
        <div class="bg-gray-950 p-6 border-b border-gray-700">
            <h1 class="text-2xl font-bold text-blue-400 text-center">📚 Librería Microservicios</h1>
            <p class="text-sm text-gray-400 text-center mt-2">Servicio de Órdenes (Puerto 3002)</p>
        </div>

        <div class="p-6">
            <form id="ordenForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">ID del Libro (1 al 5)</label>
                    <input type="number" id="libroId" required min="1" max="99" 
                           class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Cantidad a Comprar</label>
                    <input type="number" id="cantidad" required min="1"
                           class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Nombre del Cliente</label>
                    <input type="text" id="cliente" required placeholder="Ej. Luis"
                           class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                </div>

                <button type="submit" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 mt-4">
                    Procesar Orden
                </button>
            </form>

            <div id="respuestaConsola" class="mt-6 hidden">
                <h3 class="text-sm font-bold text-gray-400 mb-2">Respuesta del Servidor:</h3>
                <pre id="jsonRespuesta" class="bg-gray-950 text-green-400 p-4 rounded-lg text-xs overflow-x-auto border border-gray-700"></pre>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('ordenForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Recoger los datos del formulario
            const libroId = parseInt(document.getElementById('libroId').value);
            const cantidad = parseInt(document.getElementById('cantidad').value);
            const cliente = document.getElementById('cliente').value;
            
            const consola = document.getElementById('respuestaConsola');
            const jsonPantalla = document.getElementById('jsonRespuesta');

            try {
                // Hacer la petición HTTP a tu propio backend de órdenes
                const response = await fetch('/api/ordenes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ libroId, cantidad, cliente })
                });

                const data = await response.json();
                
                // Mostrar la consola
                consola.classList.remove('hidden');
                
                // Formatear JSON y cambiar color según el estado
                jsonPantalla.textContent = JSON.stringify(data, null, 2);
                
                if (response.ok) {
                    jsonPantalla.className = "bg-gray-950 text-green-400 p-4 rounded-lg text-xs overflow-x-auto border border-gray-700";
                } else {
                    jsonPantalla.className = "bg-gray-950 text-red-400 p-4 rounded-lg text-xs overflow-x-auto border border-gray-700";
                }

            } catch (error) {
                consola.classList.remove('hidden');
                jsonPantalla.className = "bg-gray-950 text-red-500 p-4 rounded-lg text-xs overflow-x-auto border border-gray-700";
                jsonPantalla.textContent = "Error de red al intentar conectar con el microservicio.";
            }
        });
    </script>
</body>
</html>
